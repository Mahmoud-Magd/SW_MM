name: Android CI (Debug)

on:
  push:
    paths:
      - '.github/workflows/android_debug.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'

  workflow_dispatch:


jobs:



  # =========================================================
  # NOTIFY TELEGRAM (same as before)
  # =========================================================
  notifyTelegram:
    name: Notify Telegram
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:

      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Setup Python environment for notification script
      # ---------------------------------------------------------
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ---------------------------------------------------------
      # Install required dependency for HTTP requests
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: |
          pip install requests

      # ---------------------------------------------------------
      # Send Telegram message BEFORE build starts
      # (useful for tracking CI pipeline status)
      # ---------------------------------------------------------
      - name: Send a message to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: |
          python ./.github/workflows/notify_telegram.py
        continue-on-error: true



  # =========================================================
  # BUILD DEBUG APK (NEW ADDITION)
  # =========================================================
  buildDebug:
    name: Build Debug APK

    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}

    steps:

      - uses: actions/checkout@v4



      # ---------------------------------------------------------
      # Setup Java (required for Android Gradle Plugin)
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin



      # ---------------------------------------------------------
      # Inject Google Services JSON (OPTIONAL MOCK SUPPORT)
      #
      # WHY THIS EXISTS:
          # Firebase plugin crashes if file is missing
          # Debug builds are allowed to use fake config
          # Real Firebase not needed for CI debug APK
      # ---------------------------------------------------------
      - name: Inject Google Services JSON (Debug Safe Mock)
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |

          # If secret exists → use it
          # Otherwise generate a minimal dummy file

          if [ -n "$JSON_CONTENT" ]; then
            echo "$JSON_CONTENT" > app/google-services.json
          else
            mkdir -p app

            # Create minimal mock config
            # PURPOSE:
                # Prevent Google Services plugin crash
                # No real Firebase initialization required in debug CI builds

            cat > app/google-services.json <<EOF
{
  "project_info": {
    "project_number": "000000000000",
    "project_id": "mock-project"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:000000000000:android:mock",
        "android_client_info": {
          "package_name": "com.mock.app"
        }
      }
    }
  ]
}
EOF
          fi



      # ---------------------------------------------------------
      # Setup Gradle caching
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3



      # ---------------------------------------------------------
      # BUILD DEBUG APK
      #
      # WHY DEBUG:
          # Faster compilation
          # No ProGuard/minification
          # No signing requirements
          # CI validation only
      # ---------------------------------------------------------
      - name: Build Debug APK
        run: gradle assembleDebug



      # ---------------------------------------------------------
      # Extract short commit SHA for artifact naming
      # ---------------------------------------------------------
      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT



      # ---------------------------------------------------------
      # Rename APK for traceability
      # ---------------------------------------------------------
      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/app-debug-${{ steps.set_sha.outputs.short_sha }}.apk



      # ---------------------------------------------------------
      # Upload debug artifact
      # ---------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/debug/app-debug-${{ steps.set_sha.outputs.short_sha }}.apk



  # =========================================================
  # BUILD RELEASE APK (UNCHANGED LOGIC)
  # =========================================================
  build:
    name: Build Release APK

    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}

    steps:

      - uses: actions/checkout@v4



      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin



      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf 'GOOGLE_SERVICES_JSON<<EOF\n%s\nEOF\n' "$JSON_CONTENT" >> $GITHUB_ENV



      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3



      - name: Build Release APK
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: gradle assembleRelease



      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT



      - name: Rename APK with commit hash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk



      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-release-${{ steps.set_sha.outputs.short_sha }}.apk



  # =========================================================
  # SEND TO TELEGRAM
  # =========================================================
  aggregateAndSend:
    name: Send APKs to Telegram

    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    needs: [build, buildDebug]

    steps:

      - uses: actions/checkout@v4



      # ---------------------------------------------------------
      # Download RELEASE artifact
      # ---------------------------------------------------------
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./release



      # ---------------------------------------------------------
      # Download DEBUG artifact
      # ---------------------------------------------------------
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: apk-debug-${{ needs.buildDebug.outputs.short_sha }}
          path: ./debug



      # ---------------------------------------------------------
      # Python setup for Telegram upload
      # ---------------------------------------------------------
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install telethon



      # ---------------------------------------------------------
      # Send both APKs
      # ---------------------------------------------------------
      - name: Send APKs to Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}

          RELEASE_APK: ./release/app-release-${{ needs.build.outputs.short_sha }}.apk
          DEBUG_APK: ./debug/app-debug-${{ needs.buildDebug.outputs.short_sha }}.apk

        run: |
          python ./.github/workflows/deploy_artifacts.py



  # =========================================================
  # UPDATE APP DATA (UNCHANGED)
  # =========================================================
  updateAppData:
    name: Update App Data
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Update App Script
        run: python .github/workflows/update_app_data.py

      - name: Commit and Push Changes
        env:
          GH_ABOUT_APP_WORKFLOW_TOKEN: ${{ secrets.GH_ABOUT_APP_WORKFLOW_TOKEN }}
        run: |
          git checkout host
          git config --global user.name "Sketchware Pro Actions"
          git config --global user.email "hello@sketchware.pro"
          git add about.json
          git commit -m "feat: Update app about screen data"
          git push
        continue-on-error: true
